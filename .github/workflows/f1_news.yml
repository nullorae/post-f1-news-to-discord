name: Fetch F1 News
on:
  schedule:
    - cron: '0 */2 * * *' # Automatically runs every 2 hours
  workflow_dispatch: # Allows you to manually click "Run workflow"

jobs:
  f1_news_to_discord:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS and Post to Discord
        run: |
          # Fetch the latest 3 F1 headlines & links from the free feed
          FEED_DATA=$(curl -s https://motorsport.com)
          
          # Extract titles and URLs using standard text filtering
          echo "$FEED_DATA" | grep -oP '(?<=<item>).*?(?=</item>)' | head -n 3 | while read -r item; do
            TITLE=$(echo "$item" | grep -oP '(?<=<title><!\[CDATA\[).*?(?=\]\]></title>)' || echo "$item" | grep -oP '(?<=<title>).*?(?=</title>)')
            LINK=$(echo "$item" | grep -oP '(?<=<link>).*?(?=</link>)')
            
            # Format the text message nicely for Discord
            MESSAGE="🏎️ **New F1 Article:** $TITLE \n🔗 $LINK"
            
            # Send it directly to your Discord webhook
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\": \"$MESSAGE\"}" \
                 ${{ secrets.DISCORD_WEBHOOK }}
          done
